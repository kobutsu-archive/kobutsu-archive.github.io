
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>古物流通公社</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- ヘッダー -->
  <header>
    <p>物品管理・流通情報</p>
    <h1>古物流通公社</h1>
  </header>

  <!-- ナビゲーション -->
  <nav aria-label="メインナビゲーション">
    <a href="index.html">HOME</a>
    <a href="about.html">ABOUT</a>
    <a href="archive.html">ARCHIVE</a>
    <a href="shop.html">SHOP</a>
    <a href="contact.html">CONTACT</a>
  </nav>

  <!-- メインコンテンツ -->
  <main>
    <div class="page-heading">
      <p>PUBLIC INFORMATION</p>
      <h2>トップページ</h2>
    </div>

    <section>
      <h3>お知らせ</h3>
      <p>現在、お知らせはありません。</p>
    </section>

    <section>
      <h3>取扱物品</h3>
      <p>現在、ご購入が可能な物品は公式ショップからご確認いただけます。</p>
      <small>
      ・物品名称<br>
      ・管理番号<br>
      ・物品収集日時<br>
      ・その他関連情報<br>
      </small>
      <p><a href="shop.html">取扱物品を確認する</a></p>
    </section>

    <section>
      <h3>物品照会</h3>
      <p>当公社にてご購入いただいた物品は、同封のシリアルコードを入力することで<br>以下の詳細情報をご確認いただけます。</p>
      <p><a href="shop.html">物品情報を照会する</a></p>
    </section>

  </main>

  <!-- フッター -->
  <footer>
    <div>Created by ogu²</div>
    <div class="fiction-note">This is a fictional project.</div>
  </footer>

  <!-- ナビゲーション制御 -->
  <script>
    const nav = document.querySelector("nav");
    const links = [...nav.querySelectorAll("a")];

    const currentPage =
      window.location.pathname.split("/").pop() || "index.html";

    const foundIndex = links.findIndex(
      link => link.getAttribute("href") === currentPage
    );

    const currentIndex = foundIndex >= 0 ? foundIndex : 0;

    // 現在のページを設定
    links.forEach((link, index) => {
      const isCurrentPage = index === currentIndex;

      link.classList.toggle("active", isCurrentPage);

      if (isCurrentPage) {
        link.setAttribute("aria-current", "page");
      } else {
        link.removeAttribute("aria-current");
      }
    });

    // 下線とハイライトを切り替える
    function highlightLink(index) {
      nav.style.setProperty("--active-index", index);
      nav.classList.add("is-highlighting");

      links.forEach((link, i) => {
        link.classList.toggle("highlight", i === index);
      });
    }

    // 現在のページの表示に戻す
    function resetHighlight() {
      nav.style.setProperty("--active-index", currentIndex);
      nav.classList.remove("is-highlighting");

      links.forEach(link => {
        link.classList.remove("highlight");
      });
    }

    resetHighlight();

    // マウス・キーボード操作
    links.forEach((link, index) => {
      link.addEventListener("mouseenter", () => {
        highlightLink(index);
      });

      link.addEventListener("focus", () => {
        highlightLink(index);
      });
    });

    // ナビゲーションから離れたら元に戻す
    nav.addEventListener("mouseleave", resetHighlight);

    nav.addEventListener("focusout", event => {
      if (!nav.contains(event.relatedTarget)) {
        resetHighlight();
      }
    });
  </script>
</body>
</html>
