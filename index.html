
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="古物流通公社の公式情報ページです。取扱物品や物品照会に関する情報をご案内します。">
  <title>HOME | 古物流通公社</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- ヘッダー -->
  <header>
    <p>物品管理・流通情報</p>
    <h1>古物流通公社</h1>
  </header>

  <!-- ナビゲーション -->
  <nav aria-label="メインナビゲーション">
    <a href="index.html">HOME</a>
    <a href="about.html">ABOUT</a>
    <a href="archive.html">ARCHIVE</a>
    <a href="shop.html">SHOP</a>
    <a href="contact.html">CONTACT</a>
  </nav>

  <!-- メインコンテンツ -->
  <main class="home-main">
    <div class="page-heading">
      <p>PUBLIC INFORMATION</p>
      <h2>トップページ</h2>
    </div>

    <!-- お知らせ -->
    <section>
      <h3>お知らせ</h3>
      <p>現在、お知らせはありません。</p>
    </section>

    <!-- 取扱物品 -->
    <section>
      <h3>取扱物品</h3>
      <p>現在、ご購入が可能な物品は公式ショップからご確認いただけます。</p>
      <p>
        <a href="shop.html">取扱物品を確認する</a>
      </p>
    </section>

    <!-- 物品照会 -->
    <section>
      <h3>物品照会</h3>
      <p>
        当公社にてご購入いただいた物品は、同封のシリアルコードを入力することで、以下の詳細情報をご確認いただけます。
      </p>

      <div class="item-info">
        ・物品名称<br>
        ・管理番号<br>
        ・物品収集日時<br>
        ・その他関連情報
      </div>

      <p>
        <a href="archive.html">物品情報を照会する</a>
      </p>
    </section>
  </main>

  <!-- フッター -->
  <footer>
    <div>Created by ogu²</div>
    <div class="fiction-note">This is a fictional project.</div>
  </footer>

  <!-- ナビゲーション制御 -->
  <script>
    (() => {
      const nav = document.querySelector("nav");
      if (!nav) return;

      const links = [...nav.querySelectorAll("a")];

      const currentPage =
        window.location.pathname.split("/").pop() || "index.html";

      const foundIndex = links.findIndex(link => {
        const href = link.getAttribute("href");
        return href === currentPage;
      });

      const currentIndex = foundIndex >= 0 ? foundIndex : 0;

      // 現在のページを設定
      links.forEach((link, index) => {
        const isCurrentPage = index === currentIndex;

        link.classList.toggle("active", isCurrentPage);

        if (isCurrentPage) {
          link.setAttribute("aria-current", "page");
        } else {
          link.removeAttribute("aria-current");
        }
      });

      // 下線を移動
      function highlightLink(index) {
        nav.style.setProperty("--active-index", index);
      }

      // 現在のページの位置に戻す
      function resetHighlight() {
        nav.style.setProperty("--active-index", currentIndex);
      }

      resetHighlight();

      links.forEach((link, index) => {
        link.addEventListener("mouseenter", () => {
          highlightLink(index);
        });

        link.addEventListener("focus", () => {
          highlightLink(index);
        });
      });

      nav.addEventListener("mouseleave", resetHighlight);

      nav.addEventListener("focusout", event => {
        if (!nav.contains(event.relatedTarget)) {
          resetHighlight();
        }
      });
    })();
  </script>
</body>
</html>
