<head>

  <style>
    * {

    body {
      margin: 0;

    header {
      padding: 30px 8%;

      background: #263b50;
    }

    header h1 {
      margin: 0;
      font-size: 25px;

      letter-spacing: 0.08em;
    }

    header p {

      color: #d4dce4;
      font-size: 12px;

    nav {

      flex-wrap: wrap;
      gap: 30px;
      padding: 0 8%;

    }

    nav a.active {
      color: #263b50;
      border-bottom-color: #263b50;
    }

    main {
      max-width: 900px;
      margin: 38px auto;
      padding: 0 20px;
    }

    .page-heading {
      margin-bottom: 28px;
    }

    .page-heading p {
      margin: 0;
      color: #737b82;
      font-size: 11px;
      letter-spacing: 0.16em;
    }

    .page-heading h2 {
      margin: 3px 0 0;
      font-size: 23px;
      font-weight: 500;
    }

    section {
      margin-bottom: 24px;
      padding: 24px;
      background: white;
      border: 1px solid #deded9;
    }

    section h3 {
      margin-top: 0;
      font-size: 17px;
      font-weight: 500;
      border-bottom: 1px solid #ddd;
      padding-bottom: 10px;
    }

    a {
      color: #345a7b;
    }

    .notice-date {
      color: #777;
      font-size: 12px;
    }

    footer {
      margin-top: 60px;
      padding: 24px;
      text-align: center;
      color: #686868;
      font-size: 12px;
      border-top: 1px solid #ddd;
    }

    .fiction-note {
  margin-top: 2px;
  font-size: 10px;
  color: #888888;
}

    @media (max-width: 520px) {
      nav {
        gap: 20px;
      }

      main {
        margin-top: 28px;
      }

      section {
        padding: 18px;
      }
    }
  </style>
</head>
