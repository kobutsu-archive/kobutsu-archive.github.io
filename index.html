
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>古物流通公社</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- ヘッダー -->
  <header>
    <p>物品管理・流通情報</p>
    <h1>古物流通公社</h1>
  </header>

  <!-- ナビゲーション -->
  <nav aria-label="メインナビゲーション">
    <a href="index.html">HOME</a>
    <a href="about.html">ABOUT</a>
    <a href="archive.html">ARCHIVE</a>
    <a href="shop.html">SHOP</a>
    <a href="contact.html">CONTACT</a>
  </nav>

  <!-- メインコンテンツ -->
  <main>
    <div class="page-heading">
      <p>PUBLIC INFORMATION</p>
      <h2>トップページ</h2>
    </div>

    <section>
      <h3>公社案内</h3>
      <p>古物流通公社の情報案内ページです。</p>
      <p>当公社の取扱物品および流通に関する情報を掲載しています。</p>
    </section>

    <section>
      <h3>お知らせ</h3>
      <p class="notice-date">現在</p>
      <p>現在、お知らせはありません。</p>
    </section>

    <section>
      <h3>公開物品台帳</h3>
      <p>公開対象物品の概要は、公開物品台帳からご確認いただけます。</p>
      <p><a href="archive.html">公開物品台帳を見る →</a></p>
    </section>
  </main>

  <!-- フッター -->
  <footer>
    <div>Created by ogu²</div>
    <div class="fiction-note">This is a fictional project.</div>
  </footer>

  <!-- ナビゲーション制御 -->
  <script>
    const nav = document.querySelector("nav");
    const links = [...nav.querySelectorAll("a")];

    const currentPage =
      window.location.pathname.split("/").pop() || "index.html";

    const currentIndex = Math.max(
      0,
      links.findIndex(link => link.getAttribute("href") === currentPage)
    );

    // 現在のページを設定
    links.forEach((link, index) => {
      const isCurrentPage = index === currentIndex;

      link.classList.toggle("active", isCurrentPage);

      if (isCurrentPage) {
        link.setAttribute("aria-current", "page");
      } else {
        link.removeAttribute("aria-current");
      }
    });

    // 下線を指定した項目へ移動
    function moveUnderline(index) {
      nav.style.setProperty("--active-index", index);
    }

    // 初期位置は現在のページ
    moveUnderline(currentIndex);

    // マウス・キーボード操作
    links.forEach((link, index) => {
      link.addEventListener("mouseenter", () => {
        moveUnderline(index);
      });

      link.addEventListener("focus", () => {
        moveUnderline(index);
      });
    });

    // ナビゲーションを離れたら元の位置へ戻す
    function resetUnderline() {
      moveUnderline(currentIndex);
    }

    nav.addEventListener("mouseleave", resetUnderline);

    nav.addEventListener("focusout", event => {
      if (!nav.contains(event.relatedTarget)) {
        resetUnderline();
      }
    });
  </script>
</body>
</html>
