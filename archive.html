<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>物品照会 | 古物流通公社</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- ヘッダー -->
  <header>
    <p>物品管理・流通情報</p>
    <h1>古物流通公社</h1>
  </header>

  <!-- ナビゲーション -->
  <nav aria-label="メインナビゲーション">
    <a href="index.html">HOME</a>
    <a href="about.html">ABOUT</a>
    <a href="archive.html">ARCHIVE</a>
    <a href="shop.html">SHOP</a>
    <a href="contact.html">CONTACT</a>
  </nav>

  <!-- メインコンテンツ -->
  <main>
<div class="page-heading">
  <p>ITEM INFORMATION SYSTEM</p>
  <h2>物品照会</h2>
</div>

<h3>シリアルコード入力</h3>

<p>物品に付属するシリアルコードを入力してください。</p>

<form id="serial-form">
  <div class="serial-inputs">
    <input
      type="text"
      class="serial-part"
      maxlength="3"
      placeholder="ARC"
      aria-label="分類記号3文字"
      autocomplete="off"
      autocapitalize="characters"
      required
    >

    <input
      type="text"
      class="serial-part"
      maxlength="4"
      inputmode="numeric"
      placeholder="0000"
      aria-label="個別番号1"
      autocomplete="off"
      required
    >

    <input
      type="text"
      class="serial-part"
      maxlength="4"
      inputmode="numeric"
      placeholder="0000"
      aria-label="個別番号2"
      autocomplete="off"
      required
    >

    <input
      type="text"
      class="serial-part"
      maxlength="4"
      inputmode="numeric"
      placeholder="0000"
      aria-label="個別番号3"
      autocomplete="off"
      required
    >
  </div>

  <button type="submit">照会する</button>
  <p id="serial-message" aria-live="polite"></p>
</form>
    </section>
  </main>

  <!-- フッター -->
  <footer>
    <div>Created by ogu²</div>
    <div class="fiction-note">This is a fictional project.</div>
  </footer>

  <!-- ナビゲーション・シリアルコード制御 -->
  <script>
    // 現在のページをナビゲーションに反映
    const nav = document.querySelector("nav");
    const links = [...nav.querySelectorAll("a")];

    const currentPage =
      window.location.pathname.split("/").pop() || "index.html";

    const currentIndex = links.findIndex(
      link => link.getAttribute("href") === currentPage
    );

    links.forEach((link, index) => {
      const isCurrentPage = index === currentIndex;

      link.classList.toggle("active", isCurrentPage);

      if (isCurrentPage) {
        link.setAttribute("aria-current", "page");
      } else {
        link.removeAttribute("aria-current");
      }
    });

    nav.style.setProperty(
      "--active-index",
      Math.max(0, currentIndex)
    );

    // シリアルコード入力制御
    const form = document.getElementById("serial-form");
    const parts = [...document.querySelectorAll(".serial-part")];
    const message = document.getElementById("serial-message");

    parts.forEach((input, index) => {
      input.addEventListener("input", () => {
        if (index === 0) {
          input.value = input.value
            .replace(/[^a-zA-Z]/g, "")
            .toUpperCase();
        } else {
          input.value = input.value.replace(/\D/g, "");
        }

        if (
          input.value.length === input.maxLength &&
          index < parts.length - 1
        ) {
          parts[index + 1].focus();
        }

        message.textContent = "";
      });

      input.addEventListener("keydown", event => {
        if (
          event.key === "Backspace" &&
          input.value === "" &&
          index > 0
        ) {
          parts[index - 1].focus();
        }
      });
    });

    // 現段階では照会処理は未実装
    form.addEventListener("submit", event => {
      event.preventDefault();

      const code = parts.map(input => input.value).join("-");

      message.textContent = "照会システム未接続：" + code;
    });
  </script>
</body>
</html>
