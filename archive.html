<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>物品照会 | 古物流通公社</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <p>物品管理・流通情報</p>
    <h1>古物流通公社</h1>
  </header>

  <nav aria-label="メインナビゲーション">
    <a href="index.html">HOME</a>
    <a href="about.html">ABOUT</a>
    <a href="archive.html">ARCHIVE</a>
    <a href="shop.html">SHOP</a>
    <a href="contact.html">CONTACT</a>
  </nav>

  <main class="archive-main">
    <div class="page-heading">
      <p>ITEM INFORMATION SYSTEM</p>
      <h2>物品照会システム</h2>
    </div>

    <p class="archive-description">
      照会対象物品のシリアルコードを入力してください。
    </p>

    <form id="serial-form" class="serial-form">
      <label class="serial-label">SERIAL CODE</label>

      <div class="serial-inputs">
        <input
          type="text"
          class="serial-part"
          maxlength="3"
          placeholder="ARC"
          aria-label="分類記号3文字"
          autocomplete="off"
          autocapitalize="characters"
          required
        >

        <input
          type="text"
          class="serial-part"
          maxlength="4"
          inputmode="numeric"
          placeholder="0000"
          aria-label="個別番号1"
          autocomplete="off"
          required
        >

        <input
          type="text"
          class="serial-part"
          maxlength="4"
          inputmode="numeric"
          placeholder="0000"
          aria-label="個別番号2"
          autocomplete="off"
          required
        >

        <input
          type="text"
          class="serial-part"
          maxlength="4"
          inputmode="numeric"
          placeholder="0000"
          aria-label="個別番号3"
          autocomplete="off"
          required
        >
      </div>

      <button type="submit">
        照会する <span>→</span>
      </button>

      <p id="serial-message" aria-live="polite"></p>
    </form>

    <div class="archive-notice">
      <span>INFORMATION</span>
      <p>
        シリアルコードは対象物品に付属する記録をご確認ください。
        入力内容をご確認のうえ、照会を実行してください。
      </p>
    </div>
  </main>

  <footer>
    <div>Created by ogu²</div>
    <div class="fiction-note">This is a fictional project.</div>
  </footer>

  <script>
    // ナビゲーション
    const nav = document.querySelector("nav");
    const links = [...nav.querySelectorAll("a")];

    const currentPage =
      window.location.pathname.split("/").pop() || "index.html";

    const foundIndex = links.findIndex(
      link => link.getAttribute("href") === currentPage
    );

    const currentIndex = foundIndex >= 0 ? foundIndex : 0;

    links.forEach((link, index) => {
      const isCurrentPage = index === currentIndex;

      link.classList.toggle("active", isCurrentPage);

      if (isCurrentPage) {
        link.setAttribute("aria-current", "page");
      } else {
        link.removeAttribute("aria-current");
      }
    });

    function highlightLink(index) {
      nav.style.setProperty("--active-index", index);
    }

    function resetHighlight() {
      nav.style.setProperty("--active-index", currentIndex);
    }

    resetHighlight();

    links.forEach((link, index) => {
      link.addEventListener("mouseenter", () => {
        highlightLink(index);
      });

      link.addEventListener("focus", () => {
        highlightLink(index);
      });
    });

    nav.addEventListener("mouseleave", resetHighlight);

    nav.addEventListener("focusout", event => {
      if (!nav.contains(event.relatedTarget)) {
        resetHighlight();
      }
    });

    // シリアルコード入力
    const form = document.getElementById("serial-form");
    const parts = [...document.querySelectorAll(".serial-part")];
    const message = document.getElementById("serial-message");

    parts.forEach((input, index) => {
      input.addEventListener("input", () => {
        if (index === 0) {
          input.value = input.value
            .replace(/[^a-zA-Z]/g, "")
            .toUpperCase()
            .slice(0, 3);
        } else {
          input.value = input.value
            .replace(/\D/g, "")
            .slice(0, 4);
        }

        message.textContent = "";

        // 入力欄が埋まったら次へ移動
        if (
          input.value.length === input.maxLength &&
          index < parts.length - 1
        ) {
          parts[index + 1].focus();
        }
      });

      input.addEventListener("keydown", event => {
        // 空欄でBackspaceを押すと前へ移動
        if (
          event.key === "Backspace" &&
          input.value === "" &&
          index > 0
        ) {
          parts[index - 1].focus();
        }

        // 左右キーで入力欄を切り替え
        if (event.key === "ArrowLeft" && index > 0) {
          parts[index - 1].focus();
        }

        if (
          event.key === "ArrowRight" &&
          index < parts.length - 1
        ) {
          parts[index + 1].focus();
        }
      });
    });

    // 照会処理（現在は仮動作）
    form.addEventListener("submit", event => {
      event.preventDefault();

      const code = parts
        .map(input => input.value)
        .join("-");

      message.textContent = "照会システム未接続：" + code;
    });
  </script>
</body>
</html>
